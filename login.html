<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - LDK Al-Fath</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { alfath: { maroon: '#9B1C1C', maroonDark: '#7F1D1D', cream: '#FFF7F5' } } } } }
    </script>
</head>
<body class="bg-gray-100 antialiased">
<div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="bg-gradient-to-br from-alfath-maroon to-alfath-maroonDark p-6 text-center text-white">
            <img src="assets/logo-alfath-putih.png" alt="Logo" class="h-10 mx-auto">
            <h1 class="font-bold mt-2">Login Admin</h1>
            <p class="text-xs text-red-100">Panel LDK Al-Fath (dummy, belum backend)</p>
        </div>
        <form action="dashboard.html" method="get" class="p-6 space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" required placeholder="admin@alfath.id" class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-alfath-maroon">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-alfath-maroon">
            </div>
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-gray-600"><input type="checkbox" class="rounded"> Ingat saya</label>
                <a href="#" class="text-alfath-maroon font-semibold">Lupa password?</a>
            </div>
            <button type="submit" class="w-full bg-alfath-maroon text-white font-semibold rounded-lg py-2.5 hover:bg-alfath-maroonDark">Masuk ke Dashboard</button>
            <a href="index.html" class="block text-center text-sm text-gray-600 hover:text-alfath-maroon">← Kembali ke Beranda</a>
        </form>
    </div>
</div>
</body>
</html>
