<!DOCTYPE html>
<!--
 @file data.html
 @brief Render the Al-Fath article management interface.
 @author ray
 @created 2026-10-18
 @todo none
-->
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Artikel - Admin LDK Al-Fath</title>
    <link rel="stylesheet" href="style/w5.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { alfath: { maroon: '#9B1C1C', maroonDark: '#7F1D1D', cream: '#FFF7F5' } } } } }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">
<div class="min-h-screen lg:flex">
    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>
    <aside id="sidebar" class="fixed lg:static z-40 w-64 h-screen bg-gray-900 text-gray-200 flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
        <div class="p-5 flex items-center gap-2 border-b border-white/10">
            <img src="assets/logo-alfath-putih.png" alt="Logo" class="h-9 w-auto"><span class="font-bold text-sm">Admin Al-Fath</span>
        </div>
        <nav class="flex-1 p-4 space-y-1 text-sm">
            <a href="dashboard.html" class="block px-3 py-2.5 rounded-lg hover:bg-white/10">Dashboard</a>
            <a href="data.html" class="block px-3 py-2.5 rounded-lg bg-alfath-maroon text-white font-semibold">Data Artikel</a>
            <a href="form-upload.html" class="block px-3 py-2.5 rounded-lg hover:bg-white/10">Tambah Artikel</a>
            <a href="index.html" class="block px-3 py-2.5 rounded-lg hover:bg-white/10">Lihat Situs →</a>
        </nav>
        <div class="p-4 border-t border-white/10 text-sm"><a href="login.html" class="block text-center px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20">Keluar</a></div>
    </aside>

    <div id="admin-content" class="flex-1 min-w-0">
        <header class="sticky top-0 z-20 bg-white shadow px-4 sm:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="sidebar-toggle" class="lg:hidden p-2 border rounded-lg" aria-label="Buka sidebar" aria-controls="sidebar" aria-expanded="false">☰</button>
                <div><h1 class="font-bold text-lg">Data Artikel</h1><p class="text-xs text-gray-500">Kelola daftar artikel terdaftar</p></div>
            </div>
            <a href="form-upload.html" class="bg-alfath-maroon text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-alfath-maroonDark">+ Tambah</a>
        </header>

        <main class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
            <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
                <p id="storage-status" class="text-sm text-gray-500">Data demo lokal · tanpa backend</p>
                <button id="reset-data" type="button" class="text-sm text-alfath-maroon font-semibold underline underline-offset-4">Reset Data Demo</button>
            </div>
            <div id="storage-warning" role="alert" class="mb-4 rounded-lg border border-amber-300 bg-amber-50 p-4 text-sm text-amber-900" style="display:none"></div>
            <div id="notification" role="status" aria-live="polite" class="mb-4 rounded-lg border p-4 text-sm" style="display:none"></div>
            <div class="bg-white rounded-xl shadow">
                <!-- Toolbar: stack di mobile, row di desktop -->
                <div class="p-5 flex flex-col md:flex-row md:items-center gap-3 border-b">
                    <label for="article-search" class="sr-only">Cari judul artikel</label>
                    <input id="article-search" type="search" placeholder="Cari judul..." class="w-full md:w-64 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-alfath-maroon">
                    <label for="category-filter" class="sr-only">Filter kategori</label>
                    <select id="category-filter" class="w-full md:w-48 border rounded-lg px-3 py-2 text-sm">
                        <option value="">Semua Kategori</option><option value="kajian">Kajian Islam</option><option value="kegiatan">Berita Kegiatan</option><option value="opini">Opini &amp; Edukasi</option>
                    </select>
                    <span id="result-count" role="status" class="text-xs text-gray-500 md:ml-auto"></span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm min-w-[640px]">
                        <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                            <tr><th scope="col" class="text-left px-5 py-3">ID</th><th scope="col" class="text-left px-5 py-3">Judul</th><th scope="col" class="text-left px-5 py-3">Kategori</th><th scope="col" class="text-left px-5 py-3">Tanggal</th><th scope="col" class="text-left px-5 py-3">Status</th><th scope="col" class="text-left px-5 py-3">Aksi</th></tr>
                        </thead>
                        <tbody id="article-table-body" class="divide-y"></tbody>
                    </table>
                </div>
                <div class="p-4 flex items-center justify-between text-sm border-t">
                    <span id="page-info" class="text-gray-500"></span>
                    <div class="flex gap-2"><button id="prev-page" type="button" class="px-3 py-1.5 border rounded-lg" aria-label="Halaman sebelumnya">‹ Prev</button><button id="next-page" type="button" class="px-3 py-1.5 border rounded-lg" aria-label="Halaman berikutnya">Next ›</button></div>
                </div>
            </div>
            <section id="article-detail" aria-labelledby="detail-title" class="mt-5 bg-white rounded-xl shadow border-t-4 border-alfath-maroon p-5 sm:p-6" style="display:none">
                <div class="flex items-start justify-between gap-4">
                    <div><p class="text-xs font-semibold uppercase tracking-wider text-alfath-maroon mb-2">Detail Artikel</p><h2 id="detail-title" tabindex="-1" class="text-lg font-bold"></h2></div>
                    <button id="close-detail" type="button" class="text-sm text-gray-500 border rounded-lg px-3 py-1.5" aria-label="Tutup detail artikel">Tutup</button>
                </div>
                <p id="detail-meta" class="text-sm text-gray-500 mt-3"></p>
                <p id="detail-content" class="article-content text-sm leading-7 mt-4"></p>
                <p id="detail-cover" class="text-xs text-gray-500 border-t mt-5 pt-3"></p>
            </section>
            <!-- List alternatif untuk mobile kecil -->
            <div class="mt-4 sm:hidden space-y-2 text-sm">
                <p class="text-gray-500">Tips: geser tabel ke kiri untuk melihat kolom Aksi di layar kecil.</p>
            </div>
        </main>
    </div>
</div>
<noscript><p class="p-4 text-red-800">Aktifkan JavaScript untuk mengelola data artikel.</p></noscript>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="article-data.js"></script>
<script src="script.js"></script>
</body>
</html>
